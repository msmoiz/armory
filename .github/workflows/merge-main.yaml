name: Merge to main

on:
  push:
    branches: [main]
    tags:
      - "*"

jobs:
  build-test-publish:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    env:
      ARMORY_PASSWORD: ${{ secrets.ARMORY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-cache"

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Install Rust target (Linux)
        if: runner.os == 'Linux'
        run: rustup target add x86_64-unknown-linux-musl

      - name: Install musl tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y musl-tools

      - name: Build
        run: just build

      - name: Test
        run: just test

      - name: Check for tag
        id: check-tag
        shell: bash
        run: |
          if git tag --points-at HEAD | grep -q .; then
            echo "has_tag=true" >> $GITHUB_OUTPUT
          else
            echo "has_tag=false" >> $GITHUB_OUTPUT
          fi

      - name: Install Armory (Unix)
        if: steps.check-tag.outputs.has_tag == 'true' && runner.os != 'Windows'
        run: |
          curl https://armory.msmoiz.com/install.sh | sh
          echo "$HOME/.armory/bin" >> $GITHUB_PATH

      - name: Install Armory (Windows)
        if: steps.check-tag.outputs.has_tag == 'true' && runner.os == 'Windows'
        run: |
          Invoke-RestMethod https://armory.msmoiz.com/install.ps1 | Invoke-Expression
          "$env:USERPROFILE\.armory\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up SSH (deploy key)
        if: steps.check-tag.outputs.has_tag == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      # host key is pinned here rather than fetched with ssh-keyscan because
      # keyscan on the Windows runner's bundled OpenSSH client cannot negotiate
      # the sntrup761x25519-sha512 KEX msmoiz.com offers and fails
      - name: Configure SSH (deploy host + alias)
        if: steps.check-tag.outputs.has_tag == 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p ~/.ssh
          cat >> ~/.ssh/known_hosts <<'EOF'
          msmoiz.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFs/hSA6uHaT18qI9mFsyyiXCIDyZx9OiYToh+84VIFQ
          msmoiz.com ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBGTfoRsByYOUCA0r+2eNOjegtoTiBcYM3Gpclh9AMPrU+ndYE64AB6wfnRrxMlY1kMyaPoP0eu6xzR41Y6Eb6hM=
          EOF
          cat >> ~/.ssh/config <<EOF
          Host msmoiz.com armory
            HostName msmoiz.com
            User msmoiz
          EOF

      - name: Configure SSH (deploy host + alias, Windows)
        if: steps.check-tag.outputs.has_tag == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.ssh" | Out-Null
          @"
          msmoiz.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFs/hSA6uHaT18qI9mFsyyiXCIDyZx9OiYToh+84VIFQ
          msmoiz.com ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBGTfoRsByYOUCA0r+2eNOjegtoTiBcYM3Gpclh9AMPrU+ndYE64AB6wfnRrxMlY1kMyaPoP0eu6xzR41Y6Eb6hM=
          "@ | Out-File -Append -Encoding ascii "$env:USERPROFILE\.ssh\known_hosts"
          @"
          Host msmoiz.com armory
            HostName msmoiz.com
            User msmoiz
          "@ | Out-File -Append -Encoding ascii "$env:USERPROFILE\.ssh\config"

      - name: Publish
        if: steps.check-tag.outputs.has_tag == 'true'
        run: just publish
